      <div class="names">${st.names.slice(0,st.count).map((n,i)=>`<div class="name ${st.kinds[i]!=='human'?'bot':''}"><i style="background:${COLORS[i]}"></i><input id="name${i}" data-i="${i}" maxlength="16" value="${esc(n)}" aria-label="Player ${i+1} name"><select id="kind${i}" data-i="${i}" aria-label="Player ${i+1} type">${kinds.map(([v,l])=>`<option value="${v}" ${st.kinds[i]===v?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}</div>
      <p class="muted">AI players take their own turns. Easy forgets a lot, Medium remembers most things for a while, Hard rarely forgets.${NET.lobby?' A <b>Remote player</b> seat is for someone joining from their own device.':''}</p>
      ${NET.err?`<p class="err">${esc(NET.err)}</p>`:''}
      <button class="btn primary" id="start">${st.kinds.slice(0,st.count).includes('remote')?'Open online game':'Start game'}</button>
    </div>
    <div class="card" id="lobby" hidden></div>
    <div class="card"><span class="label">In the bag · 42 tokens</span>
      <div class="tray">${ORDER.map(t=>`<figure>${face(t)}<figcaption><b>×${TYPES[t].n}</b> ${TYPES[t].name}</figcaption></figure>`).join('')}</div>
    </div>
    <div class="card"><h2>How to play</h2>${rulesHTML()}</div>
    <footer class="foot">Copyright © 2026 Grudge Match Games</footer>`;
  bindToggles(app);
  const sync=()=>app.querySelectorAll('.name input').forEach(inp=>st.names[+inp.dataset.i]=inp.value);
  app.querySelectorAll('.name input').forEach(inp=>inp.addEventListener('input',()=>{sync();save()}));
  app.querySelectorAll('.name select').forEach(sel=>sel.onchange=()=>{
    sync(); const i=+sel.dataset.i, was=st.kinds[i]; st.kinds[i]=sel.value;
    if(AI[sel.value]&&/^Player \d$/.test(st.names[i])) st.names[i]=BOT_NAMES[i];
    if(!AI[sel.value]&&AI[was]&&st.names[i]===BOT_NAMES[i]) st.names[i]=`Player ${i+1}`;
    render();
  });
  app.querySelector('#minus').onclick=()=>{sync();st.count=Math.max(2,st.count-1);render()};
  app.querySelector('#plus').onclick=()=>{sync();st.count=Math.min(8,st.count+1);render()};
  app.querySelector('#start').onclick=()=>{
    sync();
    if(st.kinds.slice(0,st.count).includes('remote')){ if(NET.lobby) return hostOpen(st); NET.err='Online play isn’t connected right now. Check your internet connection and reload the page.'; return render() }
    newGame(st);render();
  };
  renderLobby();
  const r=app.querySelector('#resume'); if(r) r.onclick=()=>{ if(resume.net&&resume.net.host){ if(NET.lobby) hostResume(resume); return } S=resume;for(const p of S.players){p.kind=p.kind||'human';p.mem=p.mem||{}}S.tick=S.tick||0;S.turnNo=S.turnNo||0;boardEl=null;render()};
}

function renderBoard(){
  const pickable=!busy&&!NET.pending&&mine(S.cur)&&['flip','peek','hook','goggles'].includes(S.phase);
  if(S.net&&!S.net.host&&!NET.pending) boardEl.querySelectorAll('.tok.aim').forEach(e=>e.classList.remove('aim'));
  boardEl.classList.toggle('dim',pickable&&S.phase!=='flip');
  const D=S.layout.D, live=new Set();
  S.slots.forEach((s,i)=>{
    if(!s) return;
    live.add(s.id);
    let el=tokMap.get(s.id);
    if(!el){
      el=document.createElement('button'); el.className='tok'+(s.up?' up':'');
      el.innerHTML=`<span class="tilt"><span class="inner"><span class="back"></span><span class="front">${face(s.t)}</span></span></span>`;
      boardEl.appendChild(el); tokMap.set(s.id,el);
    }
    const sp=S.layout.spots[i];
    el.dataset.i=i;
    el.style.left=`${(sp.x-D/2)*100}%`; el.style.top=`${(sp.y-D/2)/S.h*100}%`; el.style.width=`${D*100}%`;
    el.style.setProperty('--r',sp.r+'deg');
    el.classList.toggle('up',s.up);
    el.classList.toggle('rev',s.up&&S.turn.rev.includes(i));
    el.classList.toggle('away',away.has(s.id));
    el.classList.toggle('pick',!s.up&&pickable);
    el.disabled=!(!s.up&&pickable);
    el.setAttribute('aria-label',s.up?TYPES[s.t].name:'Face-down token');
  });
  for(const [id,el] of tokMap) if(!live.has(id)){el.remove();tokMap.delete(id)}
}

function renderGame(){
  if(!boardEl){
    tokMap.clear();
    app.innerHTML=`
      <header class="top"><h1>Jelly Flip</h1><div class="tools">${toggleHTML()}<button class="btn small ghost hbtn" id="rulesBtn" aria-label="Rules"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h5M9 13h5"/></svg><span class="lbl">Rules</span></button><button class="btn small ghost hbtn" id="quitBtn" aria-label="Quit"></button></div></header>
      <div class="scores" id="scores"></div>
      <div class="info"><span id="tableCount"></span><span class="pile" id="pile"><span class="stack"><i></i><i></i><i></i></span><span>Scrap <b id="scrapCount"></b></span></span></div>
      <div class="boardwrap"><div class="board" id="board" style="--h:${S.h||1}"></div></div>`;
    boardEl=app.querySelector('#board');
    boardEl.addEventListener('click',e=>{const b=e.target.closest('.tok');if(b) onSlot(+b.dataset.i)});
    fitPending=true; bindToggles(app);
    app.querySelector('#rulesBtn').onclick=()=>{S.rulesOpen=true;render()};
    app.querySelector('#quitBtn').onclick=()=>{
      if(busy) return;
      if(S.quitArm){clearTimeout(aiTimer);aiTimer=null;const st=S.setup;if(S.net){leaveOnline()}S=setupState(st);try{localStorage.removeItem(KEY)}catch(e){};return render()}
      S.quitArm=true;render();setTimeout(()=>{if(S.quitArm){S.quitArm=false;render()}},3000);
    };
  }
  app.querySelector('#quitBtn').innerHTML=S.quitArm?'<span>Quit?</span>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4M15 8l4 4-4 4M19 12H9"/></svg><span class="lbl">Quit</span>';
  app.querySelector('#quitBtn').classList.toggle('armed',!!S.quitArm);

  const pend=turnPts(), pl=pulse&&Date.now()<pulse.until?pulse.p:-1;
  const sc=app.querySelector('#scores'), n=S.players.length;
  sc.style.setProperty('--cols',n<=4?n:Math.ceil(n/2)); sc.classList.toggle('compact',n>4);
  sc.innerHTML=S.players.map((p,i)=>`<div class="chip ${i===S.cur?'on':''} ${i===pl?'got':''}" data-p="${i}" style="--c:${p.color}" title="${esc(p.name)}${isAI(p)?' (AI, '+AI[p.kind].label+')':p.kind==='remote'?' (remote)':''}"><i class="${isAI(p)?'bot':''}" style="background:${p.color}">${isAI(p)?'AI':i+1}</i><span>${esc(p.name)}</span><b>${score(p)}${i===S.cur&&pend?`<small>+${pend}</small>`:''}</b>${isAI(p)?`<em>AI ${AI[p.kind].label[0]}</em>`:p.kind==='remote'?'<em>NET</em>':''}</div>`).join('');
  boardEl.style.setProperty('--c',P().color);
  app.querySelector('#tableCount').innerHTML=`On the table <b>${onTable()}</b> · game ends at 3${S.net?(!S.net.host&&!NET.hostHere?' · <span class="err">Host offline</span>':' · Online'):''}`;
  app.querySelector('#scrapCount').textContent=S.scrap.length;
  app.querySelector('#pile').classList.toggle('empty',!S.scrap.length);

  // bar
  bar.hidden=false; bar.classList.toggle('bust',!!(S.card&&S.card.bust));
  const p=P(), bot=isAI(p), me=mine(S.cur); let mini='',title='',sub='',acts='';
  const avatar=`<div class="mini avatar ${bot&&!busy?'think':''}" style="--c:${p.color}">${bot?'AI':S.cur+1}</div>`;
  if(S.card){
    mini=S.card.t?`<div class="mini ${cardHidden?'hide':''}" id="cardFace">${face(S.card.t)}</div>`:avatar;
    title=esc(S.card.title); sub=esc(S.card.body);
    if(S.phase==='card'&&me) acts=`<button class="btn primary" id="contBtn" ${busy||NET.pending?'disabled':''}>Continue</button>`;
  } else {
    const fd=faceDown().length;
    mini=avatar;
    title=`${esc(p.name)}’s turn${bot?` · AI ${AI[p.kind].label}`:''}`;
    if(S.summary&&!S.turn.rev.length) sub=esc(S.summary);
    else if(bot) sub=pend?`This turn: +${pend}. Thinking…`:'Thinking…';
    else if(!me) sub=pend?`This turn: +${pend}. Waiting for ${esc(p.name)}…`:`Waiting for ${esc(p.name)}…`;
    else sub=pend?(fd?`This turn: +${pend}. Flip again or bank it.`:'No face-down tokens left. Bank your catch.'):'Tap any face-down token to flip it.';
    if(me) acts=`<button class="btn primary" id="bankBtn" ${pend&&!busy&&!NET.pending&&S.phase==='flip'?'':'disabled'}>Bank${pend?' +'+pend:''}</button>`;
  }
  bar.innerHTML=`<div class="in">${mini}<div class="msg"><strong>${title}</strong><span>${sub}</span></div><div class="acts">${acts}</div></div><div class="foot">Copyright © 2026 Grudge Match Games</div>`;
  const bb=bar.querySelector('#bankBtn'); if(bb) bb.onclick=()=>act('b');
  const cb=bar.querySelector('#contBtn'); if(cb) cb.onclick=()=>{sfx('tap');act('c')};
  if(!S.layout||fitPending){fitPending=false;fitBoard()}
  renderBoard();

  // overlays
  if(S.rulesOpen){
    ov.hidden=false;
    ov.innerHTML=`<div class="sheet left"><h2>Rules</h2>${rulesHTML()}<div class="btnrow"><button class="btn primary" id="closeRules">Back to the game</button></div></div>`;
    ov.querySelector('#closeRules').onclick=()=>{S.rulesOpen=false;render()};
  } else if(S.phase==='handoff'){
    ov.hidden=false;
    ov.innerHTML=`<div class="sheet">${S.summary?`<p class="muted">${esc(S.summary)}</p>`:''}<span class="label">Pass the device to</span><div class="who" style="color:${p.color}">${esc(p.name)}</div><button class="btn primary" id="go">Start my turn</button></div>`;
    ov.querySelector('#go').onclick=()=>{sfx('turn');S.phase='flip';S.summary=null;render()};
  } else if(S.phase==='peeking'&&mine(S.cur)&&S.turn.peek!=null){
    if(!ov.querySelector('#peekFace')){
      const t=S.slots[S.turn.peek].t;
      ov.hidden=false;
      ov.innerHTML=`<div class="sheet"><span class="label">Only ${esc(p.name)} should see this</span><div id="peekFace" class="peekface">${face(t)}</div><h2>${TYPES[t].name}</h2><p class="muted">Remember where it was.</p><button class="btn primary" id="hide">Hide it and end turn</button></div>`;
      const f=ov.querySelector('#peekFace .face'); f.style.width='100%'; f.style.height='100%';
    }
    ov.querySelector('#hide').disabled=busy||!!NET.pending;
    ov.querySelector('#hide').onclick=()=>act('x');
  } else { ov.hidden=true; ov.innerHTML='' }
  maybeAI();
}

// Size the board to the space between the scoreboard and the card. The first time, also pick the board's shape.
let fitPending=false;
function fitBoard(){
  const wrap=boardEl.parentElement, top=wrap.getBoundingClientRect().top+scrollY;
  const availW=wrap.clientWidth, availH=Math.max(180,innerHeight-top-(bar.hidden?0:bar.offsetHeight)-8);
  if(!S.layout){ if(!S.h) S.h=Math.round(Math.min(1.45,Math.max(.55,availH/availW))*100)/100; S.layout=makeLayout(S.h); boardEl.style.setProperty('--h',S.h) }
  boardEl.style.width=Math.min(availW,availH/S.h)+'px';
}
addEventListener('resize',()=>{ if(boardEl&&S&&S.screen==='play'&&S.layout) fitBoard() });

function renderOver(){
  bar.hidden=true; boardEl=null;
  const ranked=S.players.map(p=>({...p,sc:score(p)})).sort((a,b)=>b.sc-a.sc||a.jellies-b.jellies);
  const top=ranked[0], winners=ranked.filter(r=>r.sc===top.sc&&r.jellies===top.jellies);
  const fish=p=>p.bank.filter(t=>t==='fish').length, star=p=>p.bank.filter(t=>t==='star').length;
  let place=0;
  ov.hidden=false;
  ov.innerHTML=`<div class="sheet"><span class="label">Game over</span>
    <h2>${winners.length>1?'A tie between '+winners.map(w=>esc(w.name)).join(' & '):esc(top.name)+' wins!'}</h2>
    <div class="podium">${ranked.map((r,i)=>{ if(i===0||r.sc!==ranked[i-1].sc||r.jellies!==ranked[i-1].jellies) place=i+1;
      return `<div class="row ${winners.includes(r)?'win':''}"><span class="n">${place}</span><i style="background:${r.color}"></i><div><b>${esc(r.name)}</b><small>${fish(r)} fish · ${star(r)} starfish · ${r.jellies} jellyfish</small></div><span class="s">${r.sc}</span></div>`}).join('')}</div>
    <div class="btnrow"><button class="btn primary" id="again">Grudge Match</button><button class="btn ghost" id="setup">New players</button></div><p class="foot">Copyright © 2026 Grudge Match Games</p></div>`;
  app.innerHTML='';
  const again=ov.querySelector('#again');
  if(S.net&&!S.net.host){ again.textContent='Waiting for the host…'; again.disabled=true }
  else again.onclick=()=>{ if(S.net){ hostStart(); return } newGame(S.setup);render() };
  ov.querySelector('#setup').onclick=()=>{const st=S.setup;if(S.net)leaveOnline();S=setupState(st);try{localStorage.removeItem(KEY)}catch(e){};render()};
}

// ---------- splash ----------
function startSplash(){
  const sp=document.getElementById('splash'), sea=document.getElementById('sea');
  const rows=[.14,.3,.62,.78], out=[];
  rows.forEach((y,k)=>{
    const s=44+Math.random()*40, d=9+Math.random()*7;
    out.push(`<div class="swim ${k%2?'r':''}" style="--y:${(y*100).toFixed(0)}%;--x:${(10+Math.random()*70).toFixed(0)}%;--s:${s.toFixed(0)}px;--d:${d.toFixed(1)}s;--dl:${(-Math.random()*d).toFixed(1)}s"><span class="bob" style="animation-delay:${(-Math.random()*1.5).toFixed(2)}s">${icon(k===1?'bigeye':'fish')}</span></div>`);
  });
  [.14,.76].forEach(x=>{
    const s=50+Math.random()*30, d=14+Math.random()*6;
    out.push(`<div class="drift" style="--x:${(x*100).toFixed(0)}%;--y:${(20+Math.random()*60).toFixed(0)}%;--s:${s.toFixed(0)}px;--d:${d.toFixed(1)}s;--dl:${(-Math.random()*d).toFixed(1)}s"><span class="pulse" style="animation-delay:${(-Math.random()*1.6).toFixed(2)}s">${icon('jelly')}</span></div>`);
  });
  sea.innerHTML=out.join('');
  let gone=false, touched=false;
  // soft bubbles every second or two while the loading screen is up (once the browser allows sound)
  const bubbles=setInterval(()=>{
    if(gone||!PREFS.sound||!actx||actx.state!=='running') return;
    const t=actx.currentTime, n=1+Math.floor(Math.random()*3);
    for(let k=0;k<n;k++) bubble(t+k*(.08+Math.random()*.12),.035);
  },1400);
  try{ if(PREFS.sound) audio() }catch(e){}
  const close=()=>{ if(gone) return; gone=true; clearInterval(bubbles); sp.classList.add('out'); setTimeout(()=>sp.remove(),650) };
  document.getElementById('splashGo').onclick=e=>{
    e.stopPropagation(); audio();
    if(PREFS.sound&&actx){ const t=actx.currentTime; for(let k=0;k<5;k++) bubble(t+k*.07,.045) }
    close(); musicStart();
  };
  sp.addEventListener('pointerdown',()=>{ touched=true });
  setTimeout(()=>{ if(!touched){ close() } },8000);
}

// ---------- boot ----------
window.claude?.hot?.snapshot?.(()=>({S}));
function start(d){
  const sp=document.getElementById('splash');
  if(d&&d.S){ if(sp) sp.remove() } else if(sp) startSplash();
  const saved=load();
  S=(d&&d.S&&!d.S.net)?d.S:setupState(loadSetup()||(saved&&saved.setup)||undefined);
  if(S.phase==='anim'||S.phase==='peeking') S.phase='flip';
  if(S.players) for(const p of S.players){p.kind=p.kind||'human';p.mem=p.mem||{}}
  S.tick=S.tick||0; S.turnNo=S.turnNo||0;
  clearTimeout(aiTimer); aiTimer=null;
  boardEl=null; busy=false; away.clear();
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
