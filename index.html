  boardEl.style.setProperty('--c',P().color);
  app.querySelector('#tableCount').innerHTML=`On the table <b>${onTable()}</b> · game ends at 3${S.net?(!S.net.host&&!NET.hostHere?' · <span class="err">Host offline</span>':' · Online'):''}`;
  app.querySelector('#scrapCount').textContent=S.scrap.length;
  app.querySelector('#pile').classList.toggle('empty',!S.scrap.length);

  // bar
  bar.hidden=false; bar.classList.toggle('bust',!!(S.card&&S.card.bust));
  const p=P(), bot=isAI(p), me=mine(S.cur); let mini='',title='',sub='',acts='';
  const avatar=`<div class="mini avatar ${bot&&!busy?'think':''}" style="--c:${p.color}">${bot?'AI':S.cur+1}</div>`;
  if(S.card){
    mini=S.card.t?`<div class="mini ${cardHidden?'hide':''}" id="cardFace">${face(S.card.t)}</div>`:avatar;
    title=esc(S.card.title); sub=esc(S.card.body);
    if(S.phase==='dolphin'&&me&&DOL.confirmed){ const items=['dolphin',...DOL.picks.map(k=>S.scrap[k])], next=items[DOL.spots.length];
      sub=next?`Tap a glowing spot to hide the ${TYPES[next].name.toLowerCase()}${items.length>1?` (${DOL.spots.length+1} of ${items.length})`:''}. Tap a chosen spot to undo it.`:'' }
    if(S.phase==='card'&&me) acts=`<button class="btn primary" id="contBtn" ${busy||NET.pending?'disabled':''}>${TX('continue')}</button>`;
  } else {
    const fd=faceDown().length;
    mini=avatar;
    title=`${esc(p.name)}’s turn${bot?` · AI ${AI[p.kind].label}`:''}`;
    if(S.summary&&!S.turn.rev.length) sub=esc(S.summary);
    else if(bot) sub=pend?`This turn: +${pend}. Thinking…`:'Thinking…';
    else if(!me) sub=pend?`This turn: +${pend}. Waiting for ${esc(p.name)}…`:`Waiting for ${esc(p.name)}…`;

  sc.querySelectorAll('.chip').forEach(ch=>{ const i=+ch.dataset.p; if(canSeeHand(i)){ ch.classList.add('seehand'); ch.onclick=()=>{ sfx('tap'); handOpen=i; render() } } });
  const cb=bar.querySelector('#contBtn'); if(cb) cb.onclick=()=>{sfx('tap');act('c')};
  if(!S.layout||fitPending){fitPending=false;fitBoard()}
  renderBoard();

  // overlays
  if(S.rulesOpen){
    ov.hidden=false;
    ov.innerHTML=`<div class="sheet left"><h2>${TX('rules')}</h2>${rulesHTML()}<div class="btnrow"><button class="btn primary" id="closeRules">${TX('backToGame')}</button></div></div>`;
    ov.querySelector('#closeRules').onclick=()=>{S.rulesOpen=false;render()};
  } else if(handOpen!=null&&canSeeHand(handOpen)&&S.phase!=='handoff'){
    ov.hidden=false; ov.innerHTML=handHTML(handOpen);
    ov.querySelector('#closeHand').onclick=()=>{ handOpen=null; render() };
  } else if(S.phase==='handoff'){
    handOpen=null; ov.hidden=false;
    ov.innerHTML=`<div class="sheet">${S.summary?`<p class="muted">${esc(S.summary)}</p>`:''}<span class="label">${TX('passTo')}</span><div class="who" style="color:${p.color}">${esc(p.name)}</div><button class="btn primary" id="go">${TX('startTurn')}</button></div>`;
    ov.querySelector('#go').onclick=()=>{sfx('turn');S.phase='flip';S.summary=null;render()};
  } else if(S.phase==='dolphin'&&mine(S.cur)&&!DOL.confirmed&&!busy&&!NET.pending){
    const groups={}; S.scrap.forEach((t,k)=>{(groups[t]=groups[t]||[]).push(k)});
    const max=dolMax(), n=DOL.picks.length;
    const picked=t=>DOL.picks.filter(k=>S.scrap[k]===t).length;
    ov.hidden=false;
    ov.innerHTML=`<div class="sheet"><span class="label">Only ${esc(p.name)} should see this</span><h2>Pick up to ${max} ${max===1?'token':'tokens'} to hide</h2><p class="muted">They go back on the table face down with the dolphin, in spots you choose. Nobody else will know which is which.</p>
      <div class="scrapgrid">${ORDER.filter(t=>groups[t]).map(t=>{const c=picked(t);return `<button class="scrapbtn ${c?'on':''}" data-t="${t}" ${n>=max&&!c?'disabled':''}>${face(t)}<span>${TYPES[t].name}${groups[t].length>1?` ×${groups[t].length}`:''}</span>${c?`<b class="pickcount">${c} picked</b>`:''}</button>`}).join('')}</div>
      <p class="muted">Tap a token to pick it; tap again for another of the same kind, until it goes back to none. ${n?`<button class="linkbtn" id="dolClear">Clear all</button>`:''}</p>
      <button class="btn primary" id="dolGo">${n?`Hide the dolphin and ${n===1?'this token':`these ${n} tokens`}`:'Hide just the dolphin'}</button></div>`;
    ov.querySelectorAll('.scrapbtn').forEach(b=>b.onclick=()=>{
      const t=b.dataset.t, free=groups[t].filter(k=>!DOL.picks.includes(k));
      if(free.length&&DOL.picks.length<max){ DOL.picks.push(free[0]); sfx('tap') }
      else DOL.picks=DOL.picks.filter(k=>S.scrap[k]!==t);
      render();
    });
    const cl=ov.querySelector('#dolClear'); if(cl) cl.onclick=()=>{ DOL.picks=[]; render() };
    ov.querySelector('#dolGo').onclick=()=>{ DOL.confirmed=true; DOL.spots=[]; sfx('tap'); render() };
  } else if(S.phase==='peeking'&&mine(S.cur)&&S.turn.peek!=null){
    if(!ov.querySelector('#peekFace')){
      const t=S.slots[S.turn.peek].t;
      ov.hidden=false;
      ov.innerHTML=`<div class="sheet"><span class="label">Only ${esc(p.name)} should see this</span><div id="peekFace" class="peekface">${face(t)}</div><h2>${TYPES[t].name}</h2><p class="muted">Peek ${S.turn.peeked.length} of ${S.turn.peeked.length+S.turn.picks-1}. Remember where it was.</p><button class="btn primary" id="hide">${S.turn.picks>1&&faceDown().some(j=>!S.turn.peeked.includes(j)&&j!==S.turn.peek)?'Hide it and peek again':'Hide it and end turn'}</button></div>`;
      const f=ov.querySelector('#peekFace .face'); f.style.width='100%'; f.style.height='100%';

    ov.querySelector('#hide').onclick=()=>act('x');
  } else { ov.hidden=true; ov.innerHTML='' }
  maybeAI();
}

// Size the board to the space between the scoreboard and the card. The first time, also pick the board's shape.
let fitPending=false;
function fitBoard(){
  const wrap=boardEl.parentElement, top=wrap.getBoundingClientRect().top+scrollY;
  const availW=wrap.clientWidth, availH=Math.max(180,innerHeight-top-(bar.hidden?0:bar.offsetHeight)-8);
  if(!S.layout){ if(!S.h) S.h=Math.round(Math.min(1.45,Math.max(.55,availH/availW))*100)/100; S.layout=makeLayout(S.h); boardEl.style.setProperty('--h',S.h) }
  boardEl.style.width=Math.min(availW,availH/S.h)+'px';
}
addEventListener('resize',()=>{ if(boardEl&&S&&S.screen==='play'&&S.layout) fitBoard() });

function renderOver(){
  bar.hidden=true; boardEl=null;
  const ranked=S.players.map(p=>({...p,sc:score(p),jellies:jellyCount(p)})).sort((a,b)=>b.sc-a.sc||a.jellies-b.jellies);
  const top=ranked[0], winners=ranked.filter(r=>r.sc===top.sc&&r.jellies===top.jellies);
  const fish=p=>p.bank.filter(t=>t==='fish').length, star=p=>p.bank.filter(t=>t==='star').length;
  let place=0;
  ov.hidden=false;
  ov.innerHTML=`<div class="sheet"><span class="label">${TX('gameOver')}</span>
    <h2>${winners.length>1?'A tie between '+winners.map(w=>esc(w.name)).join(' & '):esc(top.name)+' wins!'}</h2>${S.endNote?`<p class="muted">${esc(S.endNote)}</p>`:''}
    <div class="podium">${ranked.map((r,i)=>{ if(i===0||r.sc!==ranked[i-1].sc||r.jellies!==ranked[i-1].jellies) place=i+1;
      return `<div class="row ${winners.includes(r)?'win':''}"><span class="n">${place}</span><i style="background:${r.color}"></i><div><b>${esc(r.name)}</b><small>${fish(r)} fish · ${star(r)} starfish · ${r.jellies} jellyfish</small></div><span class="s">${r.sc}</span></div>`}).join('')}</div>
    <div class="btnrow"><button class="btn primary" id="again">${TX('grudge')}</button><button class="btn ghost" id="setup">${TX('newPlayers')}</button></div><p class="foot">${TX('copyright')}</p></div>`;
  app.innerHTML='';
  const again=ov.querySelector('#again');
  if(S.net&&!S.net.host){ again.textContent='Waiting for the host…'; again.disabled=true }
  else again.onclick=()=>{ if(S.net){ hostStart(); return } newGame(S.setup);render() };
  ov.querySelector('#setup').onclick=()=>{const st=S.setup;if(S.net)leaveOnline();S=setupState(st);try{localStorage.removeItem(KEY)}catch(e){};render()};
}

// ---------- splash ----------
function bubbleBurst(btn){
  const r=btn.getBoundingClientRect(), layer=document.createElement('div'); layer.className='popfx'; document.body.appendChild(layer);
  btn.style.visibility='hidden';
  if(RM.matches){ setTimeout(()=>layer.remove(),50); return }
  // the button gives a happy squish, swells fast and pops
  const ghost=btn.cloneNode(true); ghost.removeAttribute('id');
  ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;visibility:visible;transform-origin:50% 50%`;
  layer.appendChild(ghost);
  ghost.animate([
    {transform:'scale(1)',opacity:1,filter:'brightness(1)'},
    {transform:'scale(.9,.94)',opacity:1,offset:.18},
    {transform:'scale(1.3,1.22)',opacity:1,filter:'brightness(1.15)',offset:.55},
    {transform:'scale(1.55)',opacity:0,filter:'brightness(1.4)'}],{duration:260,easing:'ease-out',fill:'forwards'});
  // ...into a cloud of bubbles that balloon out, race upward and fade
  const n=38, cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(let k=0;k<n;k++){
    const b=document.createElement('i'), sz=12+Math.random()*34, a=Math.random()*Math.PI*2;
    const x=cx+Math.cos(a)*r.width*.42*Math.random(), y=cy+Math.sin(a)*r.height*.4*Math.random();
    b.style.cssText=`left:${x-sz/2}px;top:${y-sz/2}px;width:${sz}px;height:${sz}px`; layer.appendChild(b);
    const out=(Math.cos(a)*(40+Math.random()*90)), rise=260+Math.random()*Math.min(innerHeight*.7,560), w=8+Math.random()*16, d=900+Math.random()*700;
    b.animate([
      {transform:'translate(0,0) scale(.15)',opacity:0},
      {transform:`translate(${out*.5}px,${-rise*.06}px) scale(1.25)`,opacity:1,offset:.14},
      {transform:`translate(${out*.8+w}px,${-rise*.4}px) scale(1.1)`,opacity:.9,offset:.45},
      {transform:`translate(${out-w}px,${-rise*.75}px) scale(1.2)`,opacity:.55,offset:.75},
      {transform:`translate(${out*1.1}px,${-rise}px) scale(1.5)`,opacity:0}],{duration:d,delay:110+Math.random()*120,easing:'cubic-bezier(.15,.7,.35,1)',fill:'both'});
  }
  setTimeout(()=>layer.remove(),2500);
}
// the water melts away: it goes soft and blurry, swells and ripples, and clears to show the page underneath.
// Only opacity and transform change while it plays, so phones keep up.
function waterDissolve(sp,done,from){
  if(RM.matches||!sp.animate){ sp.classList.add('plain'); return setTimeout(done,650) }
  const fade=(el,o)=>el&&el.animate([{opacity:1},{opacity:0}],{duration:o.d,delay:o.dl,easing:'ease-in',fill:'forwards'});
  sp.querySelectorAll('.splash-in,.credit,.foot').forEach(k=>fade(k,{d:300,dl:60}));
  fade(sp.querySelector('.sea'),{d:400,dl:40});
  const bl=sp.querySelector('.splash-blur');
  if(bl) bl.animate([{opacity:.01,transform:'scale(1)'},{opacity:1,transform:'scale(1.04)'}],{duration:420,delay:60,easing:'ease-out',fill:'forwards'});
  // ripples spread out from where Play was
  if(from){ const layer=document.querySelector('.popfx');
    if(layer) for(let k=0;k<3;k++){ const ring=document.createElement('i'); ring.className='ring'; const sz=120;
      ring.style.cssText=`left:${from.x-sz/2}px;top:${from.y-sz/2}px;width:${sz}px;height:${sz}px`; layer.appendChild(ring);
      ring.animate([{transform:'scale(.3)',opacity:.9},{transform:`scale(${7+k*2})`,opacity:0}],{duration:1100,delay:90+k*160,easing:'cubic-bezier(.2,.7,.3,1)',fill:'both'}) } }
  const a=sp.animate([
    {opacity:1,transform:'scale(1) skew(0deg,0deg)'},
    {opacity:1,transform:'scale(1.02) skew(.8deg,-.4deg)',offset:.3},
    {opacity:.75,transform:'scale(1.06) skew(-1deg,.6deg)',offset:.55},
    {opacity:.35,transform:'scale(1.1) skew(.6deg,-.3deg)',offset:.78},
    {opacity:0,transform:'scale(1.14) skew(0deg,0deg)'}],{duration:1100,delay:220,easing:'ease-in-out',fill:'forwards'});
  animDone(a,1350).then(done);
  const app=document.getElementById('app');
  if(app) app.animate([{transform:'scale(.95)',opacity:.4},{transform:'scale(1.005) skewX(.6deg)',opacity:.9,offset:.6},{transform:'none',opacity:1}],{duration:1150,delay:260,easing:'ease-out',fill:'backwards'});
}
function startSplash(){
  const sp=document.getElementById('splash'), sea=document.getElementById('sea');
  const rows=[.14,.3,.62,.78], out=[];
  rows.forEach((y,k)=>{
    const s=44+Math.random()*40, d=9+Math.random()*7;
    out.push(`<div class="swim ${k%2?'r':''}" style="--y:${(y*100).toFixed(0)}%;--x:${(10+Math.random()*70).toFixed(0)}%;--s:${s.toFixed(0)}px;--d:${d.toFixed(1)}s;--dl:${(-Math.random()*d).toFixed(1)}s"><span class="bob" style="animation-delay:${(-Math.random()*1.5).toFixed(2)}s">${icon(k===1?'bigfish':'fish')}</span></div>`);
  });
  [.14,.76].forEach(x=>{
    const s=50+Math.random()*30, d=14+Math.random()*6;
    out.push(`<div class="drift" style="--x:${(x*100).toFixed(0)}%;--y:${(20+Math.random()*60).toFixed(0)}%;--s:${s.toFixed(0)}px;--d:${d.toFixed(1)}s;--dl:${(-Math.random()*d).toFixed(1)}s"><span class="pulse" style="animation-delay:${(-Math.random()*1.6).toFixed(2)}s">${icon('jelly')}</span></div>`);
  });
  sea.innerHTML=out.join('');
  let gone=false;
  // soft bubbles every second or two while the loading screen is up (once the browser allows sound)
  const bubbles=setInterval(()=>{
    if(gone||!PREFS.sound||!actx||actx.state!=='running') return;
    if(srcOf(customSfx('bubble'))) return playCustom(customSfx('bubble'),.8);
    const t=actx.currentTime, n=1+Math.floor(Math.random()*3);
    for(let k=0;k<n;k++) bubble(t+k*(.08+Math.random()*.12),.035);
  },1400);
  try{ if(PREFS.sound&&navigator.userActivation&&navigator.userActivation.hasBeenActive) audio() }catch(e){}
  const close=from=>{ if(gone) return; gone=true; clearInterval(bubbles); sp.classList.add('out'); waterDissolve(sp,()=>sp.remove(),from) };
  // Play pops the moment it's pressed: the button bursts into bubbles that float up over the game while the water clears
  const go=document.getElementById('splashGo');
  // phones only let sound start when the finger lifts, so the pop happens on press and the sound on release
  let sounded=false;
  // a fizz of bubble pops that rises and thins out over the length of the animation
  const sound=()=>{ if(sounded) return; sounded=true; audio();
    if(PREFS.sound&&actx){
      if(srcOf(customSfx('bubble'))) playCustom(customSfx('bubble'));
      else { const t=actx.currentTime+.02; let at=0; for(let k=0;k<16;k++){ bubble(t+at,.06*(1-k/22)); at+=.035+k*.006+Math.random()*.03 } }
    }
    musicStart() };
  const press=e=>{
    e.stopPropagation(); if(gone) return;
    const r=go.getBoundingClientRect();
    buzz(12); bubbleBurst(go); close({x:r.left+r.width/2,y:r.top+r.height/2});
  };
  go.addEventListener('pointerdown',press);
  go.addEventListener('pointerup',sound);
  go.addEventListener('click',e=>{ press(e); sound() });
}

// ---------- boot ----------
window.claude?.hot?.snapshot?.(()=>({S}));
function startTheme(){
  applyTheme(); loadThemeAssets(null).then(()=>{ applyTheme(); if(S&&!busy) render() });
  if(!studioAllowed()) return;
  fbCore().then(({D,db})=>{
    FETCH_ASSET=async id=>(await D.get(D.ref(db,'jf/assets/'+id))).val();
    const warn=e=>console.warn('theme',e&&e.code);
    D.onValue(D.ref(db,'jf/sets'),snap=>{ SETS=snap.val()||{}; THEME_LOADED|=1; refreshTheme() },warn);
    D.onValue(D.ref(db,'jf/active'),snap=>{ ACTIVE=snap.val()||null; refreshTheme() },warn);
    D.onValue(D.ref(db,'jf/theme'),snap=>{ LEGACY=snap.val()||{}; THEME_LOADED|=2; refreshTheme() },warn);
  }).catch(e=>console.warn('theme',e));
  resumeStudioRedirect();
}
function start(d){
  startTheme();
  const sp=document.getElementById('splash');
  if(d&&d.S){ if(sp) sp.remove() } else if(sp) startSplash();
  const saved=load();
  S=(d&&d.S&&!d.S.net)?d.S:setupState(loadSetup()||(saved&&saved.setup)||undefined);
  if(S.phase==='anim'||S.phase==='peeking') S.phase='flip';
  if(S.players) for(const p of S.players){p.kind=p.kind||'human';p.mem=p.mem||{}}
  S.tick=S.tick||0; S.turnNo=S.turnNo||0;
  clearTimeout(aiTimer); aiTimer=null;
  boardEl=null; busy=false; away.clear();
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
